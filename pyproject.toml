[project]
name = "chatbot-with-llm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dishani08", email = "dishanichauhan08@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.3.0",
    "langchain>=1.3.14",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.4.3",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.10",
    "python-dotenv>=1.2.2",
    "wikipedia>=1.4.0",
]

[project.scripts]
chatbot-with-llm = "chatbot_with_llm:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
